# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # Explicitly install tidyxl using pak
      - name: Install tidyxl and dependencies
        run: |
          install.packages("pak", repos = "https://r-lib.github.io/p/pak/dev/")
          pak::pkg_install("nacnudus/tidyxl")
        shell: Rscript {0}

      - name: Keep internal notes out of the published site
        run: rm -f CLAUDE.md

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # A new root-level .md would otherwise be published silently. Anything not
      # declared here fails the build rather than quietly reaching the web.
      - name: Fail if an unexpected page reached the site
        run: |
          # Absence of evidence is not evidence: with nullglob set, an unmatched
          # docs/*.html would iterate zero times and exit 0 over an empty site.
          [ -f docs/index.html ] || { echo "no site was built"; exit 1; }
          allowed="404 authors index LICENSE LICENSE-text"
          is_allowed() { for a in $allowed; do [ "$a" = "$1" ] && return 0; done; return 1; }
          rc=0
          for f in docs/*.html; do
            b=$(basename "$f" .html)
            if ! is_allowed "$b"; then echo "unexpected published page: $b"; rc=1; fi
          done
          exit $rc

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: true
          branch: gh-pages
          folder: docs
